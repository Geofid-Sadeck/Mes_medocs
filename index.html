<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mes Médicaments">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <title>Mes Médicaments</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f1a;
      --bg2: #16162a;
      --bg3: #1e1e35;
      --card: #1e1e35;
      --border: rgba(255,255,255,0.07);
      --text: #f0eeff;
      --muted: #8b8aaa;
      --accent: #a78bfa;
      --accent2: #34d399;
      --accent3: #f472b6;
      --warn: #fb923c;
      --danger: #f87171;
      --pending: #60a5fa;
      --done-bg: rgba(52,211,153,0.08);
      --done-border: rgba(52,211,153,0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overscroll-behavior: none;
    }

    /* HEADER */
    .header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 14px;
      position: sticky; top: 0; z-index: 100;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .app-title { font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
    .current-time { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; color: var(--text); }
    .current-date { font-size: 12px; color: var(--muted); margin-top: 1px; }

    /* DAY SELECTOR */
    .day-row { display: flex; gap: 6px; align-items: center; }
    .day-label { font-size: 12px; color: var(--muted); margin-right: 4px; }
    .day-btn {
      padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-size: 12px; font-family: 'DM Sans', sans-serif;
      cursor: pointer; transition: all .15s;
    }
    .day-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }

    /* PROGRESS */
    .progress-bar-wrap { background: var(--bg3); border-bottom: 1px solid var(--border); padding: 10px 20px; }
    .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .progress-label { font-size: 12px; color: var(--muted); }
    .progress-count { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--accent2); }
    .bar-bg { height: 4px; background: var(--border); border-radius: 2px; }
    .bar-fill { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s ease; }

    /* MAIN */
    .main { padding: 16px 16px 100px; }

    /* SECTION */
    .section { margin-bottom: 20px; }
    .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 0 4px; }
    .section-icon { font-size: 16px; }
    .section-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

    /* CARD */
    .med-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all .2s;
      position: relative;
      overflow: hidden;
    }
    .med-card::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 3px 0 0 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity .2s;
    }
    .med-card.status-next::before { opacity: 1; background: var(--pending); animation: pulse-bar 2s ease-in-out infinite; }
    .med-card.status-done { background: var(--done-bg); border-color: var(--done-border); }
    .med-card.status-done::before { opacity: 1; background: var(--accent2); }
    .med-card.status-late::before { opacity: 1; background: var(--danger); animation: pulse-bar 1s ease-in-out infinite; }
    .med-card.status-skip { opacity: .4; }

    @keyframes pulse-bar {
      0%,100% { opacity: .6; } 50% { opacity: 1; }
    }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card-left { flex: 1; min-width: 0; }
    .card-time-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .card-time {
      font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
      padding: 2px 8px; border-radius: 8px;
      background: rgba(167,139,250,0.12); color: var(--accent);
    }
    .card-time.computed { background: rgba(96,165,250,0.12); color: var(--pending); }
    .card-time.done { background: rgba(52,211,153,0.12); color: var(--accent2); }
    .card-time.late { background: rgba(248,113,113,0.12); color: var(--danger); }
    .card-gap { font-size: 11px; color: var(--muted); }
    .card-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
    .card-note { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .card-note b { color: var(--warn); font-weight: 500; }

    /* CHECK BUTTON */
    .check-btn {
      width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--border);
      background: var(--bg3); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s; cursor: pointer;
    }
    .check-btn svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: all .2s; }
    .med-card.status-done .check-btn { background: var(--accent2); border-color: var(--accent2); }
    .med-card.status-done .check-btn svg { stroke: #fff; }
    .med-card.status-next .check-btn { border-color: var(--pending); }
    .med-card.status-next .check-btn svg { stroke: var(--pending); }

    /* TAKEN TIME BADGE */
    .taken-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--accent2); margin-top: 6px;
      background: rgba(52,211,153,0.08); padding: 2px 8px; border-radius: 20px;
    }

    /* ALARM BADGE */
    .alarm-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--pending); margin-top: 4px;
      background: rgba(96,165,250,0.08); padding: 2px 8px; border-radius: 20px;
    }

    /* WARNING BOX */
    .alert-box {
      background: rgba(251,146,60,0.08);
      border: 1px solid rgba(251,146,60,0.2);
      border-radius: 12px; padding: 12px 16px; margin-bottom: 16px;
      font-size: 13px; color: var(--warn); line-height: 1.6;
    }
    .alert-box strong { color: var(--danger); }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--bg2); border-radius: 20px 20px 0 0;
      border-top: 1px solid var(--border);
      padding: 24px 24px 40px; width: 100%;
      transform: translateY(100%); transition: transform .3s ease;
    }
    .modal-overlay.show .modal { transform: translateY(0); }
    .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    .modal-time-display {
      font-family: 'DM Mono', monospace; font-size: 48px; font-weight: 500;
      color: var(--accent); text-align: center; margin: 20px 0;
    }
    .modal-note { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 24px; line-height: 1.6; }
    .modal-note b { color: var(--warn); }
    .modal-btn {
      width: 100%; padding: 16px; border-radius: 14px; border: none;
      background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
      font-family: 'DM Sans', sans-serif; cursor: pointer;
      transition: transform .1s, opacity .1s;
    }
    .modal-btn:active { transform: scale(0.98); opacity: .9; }
    .modal-cancel {
      width: 100%; padding: 12px; border-radius: 14px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-size: 14px;
      font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 8px;
    }

    /* ALARM NOTIFICATION */
    .alarm-toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-120px);
      background: var(--bg2); border: 1px solid var(--accent); border-radius: 16px;
      padding: 14px 20px; min-width: 280px; max-width: 340px; z-index: 300;
      display: flex; align-items: center; gap: 12px;
      transition: transform .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .alarm-toast.show { transform: translateX(-50%) translateY(0); }
    .alarm-icon { font-size: 24px; }
    .alarm-text { flex: 1; }
    .alarm-text strong { font-size: 14px; display: block; margin-bottom: 2px; }
    .alarm-text span { font-size: 12px; color: var(--muted); }
    .alarm-dismiss { font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 8px; background: var(--bg3); border: none; color: var(--muted); font-family: 'DM Sans', sans-serif; }

    /* RESET */
    .reset-area { text-align: center; padding: 8px; }
    .reset-btn { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; font-family: 'DM Sans', sans-serif; }

    /* ALL DONE */
    .all-done {
      text-align: center; padding: 32px 20px;
      display: none;
    }
    .all-done.show { display: block; }
    .all-done-icon { font-size: 48px; margin-bottom: 12px; }
    .all-done h3 { font-size: 20px; font-weight: 600; color: var(--accent2); margin-bottom: 6px; }
    .all-done p { font-size: 14px; color: var(--muted); }

    @media (min-width: 480px) {
      .main { max-width: 440px; margin: 0 auto; }
      .progress-bar-wrap { max-width: 440px; margin: 0 auto; padding-left: 0; padding-right: 0; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="app-title">💊 Mes Médicaments</div>
      <div class="current-date" id="date-display"></div>
    </div>
    <div class="current-time" id="clock-display">--:--</div>
  </div>
  <div class="day-row">
    <span class="day-label">Alternance :</span>
    <button class="day-btn active" onclick="setDay(1,this)">Jour 1</button>
    <button class="day-btn" onclick="setDay(2,this)">Jour 2</button>
    <button class="day-btn" onclick="setDay(3,this)">Jour 3</button>
  </div>
</div>

<div class="progress-bar-wrap">
  <div class="progress-row">
    <span class="progress-label">Progression du jour</span>
    <span class="progress-count" id="prog-count">0 / 0</span>
  </div>
  <div class="bar-bg"><div class="bar-fill" id="prog-bar" style="width:0%"></div></div>
</div>

<div class="main">
  <div class="alert-box">
    ⚠️ Ne jamais combiner : <strong>Fer + Calcium</strong> · <strong>Fer + Maloxine</strong><br>
    Toujours laisser <strong>2 à 3h d'écart</strong> entre ces associations.
  </div>

  <div id="meds-list"></div>
  <div class="all-done" id="all-done">
    <div class="all-done-icon">🌙</div>
    <h3>Tous les médicaments pris !</h3>
    <p>Bonne nuit. Reviens demain matin.</p>
  </div>
  <div class="reset-area">
    <button class="reset-btn" onclick="resetDay()">Réinitialiser pour demain</button>
  </div>
</div>

<!-- MODAL confirmation -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">Confirmer la prise</div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="modal-time-display" id="modal-time"></div>
    <div class="modal-note" id="modal-note"></div>
    <button class="modal-btn" id="modal-confirm">✓ Confirmer la prise</button>
    <button class="modal-cancel" onclick="closeModalDirect()">Annuler</button>
  </div>
</div>

<!-- ALARM TOAST -->
<div class="alarm-toast" id="alarm-toast">
  <div class="alarm-icon">🔔</div>
  <div class="alarm-text">
    <strong id="alarm-name">Médicament</strong>
    <span id="alarm-detail">Heure de prise</span>
  </div>
  <button class="alarm-dismiss" onclick="dismissAlarm()">OK</button>
</div>

<script>
// ---- DATA ----
const ALT = {
  1: { m10: 'Fifer sirop', soir: 'Fer + acide folique' },
  2: { m10: 'Fer + acide folique', soir: 'Fifer sirop' },
  3: { m10: 'Fifer sirop', soir: 'Fer + acide folique' }
};

// Médicaments avec délais en minutes depuis le précédent
// anchor: si true, c'est la prise initiale (heure libre)
// delayFrom: id du méd de référence
// gap: délai en minutes
const MEDS_DEF = [
  {
    id: 'tothema',
    name: 'Tot\'hema',
    note: 'À jeun · avec eau ou jus d\'orange 🍊',
    anchor: true,
    section: 'matin',
    icon: '🌅'
  },
  {
    id: 'rotavit',
    name: 'Rotavit + Butylscopolamine + Calcium/Magnésium',
    note: 'Après le petit-déjeuner · <b>attendre 2h avant le prochain fer</b>',
    delayFrom: 'tothema',
    gap: 30, // 30 min après Tot'hema → repas, puis prendre
    section: 'matin',
    icon: '🍳'
  },
  {
    id: 'fer10h',
    name: '', // rempli dynamiquement selon le jour
    note: 'Loin de Maloxine et calcium',
    delayFrom: 'rotavit',
    gap: 120,
    section: 'matin',
    icon: '🩸'
  },
  {
    id: 'buty19h',
    name: 'Butylscopolamine + Calcium/Magnésium',
    note: 'Après le dîner · <b>attendre 2–3h avant Tardyferon</b>',
    delayFrom: 'fer10h',
    gap: 540, // ~9h après le fer du matin
    section: 'soir',
    icon: '🌆'
  },
  {
    id: 'tardyferon',
    name: 'Tardyferon',
    note: 'Avec eau · <b>loin de Maloxine</b>',
    delayFrom: 'buty19h',
    gap: 150,
    section: 'soir',
    icon: '🌙'
  },
  {
    id: 'maloxine',
    name: 'Maloxine',
    note: 'Seulement si brûlures · <b>min. 2–3h après Tardyferon</b>',
    delayFrom: 'tardyferon',
    gap: 150,
    section: 'soir',
    icon: '🔥',
    optional: true
  }
];

// ---- STATE ----
let currentDay = 1;
let state = loadState();
let alarmTimers = {};
let pendingConfirmId = null;

function loadState() {
  const saved = localStorage.getItem('medoc-state-v2');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      // Reset si c'est un nouveau jour
      const today = new Date().toDateString();
      if (s.date !== today) return freshState();
      return s;
    } catch(e) {}
  }
  return freshState();
}

function freshState() {
  return {
    date: new Date().toDateString(),
    day: 1,
    taken: {} // id -> timestamp (ms)
  };
}

function saveState() {
  state.date = new Date().toDateString();
  state.day = currentDay;
  localStorage.setItem('medoc-state-v2', JSON.stringify(state));
}

// ---- TIME UTILS ----
function fmtTime(ms) {
  const d = new Date(ms);
  return d.getHours().toString().padStart(2,'0') + 'h' + d.getMinutes().toString().padStart(2,'0');
}

function fmtDuration(min) {
  if (min < 60) return min + ' min';
  const h = Math.floor(min/60), m = min%60;
  return h + 'h' + (m ? String(m).padStart(2,'0') : '');
}

// Calculer l'heure prévue d'un méd selon les prises précédentes
function getScheduledTime(medId) {
  const med = MEDS_DEF.find(m => m.id === medId);
  if (!med) return null;
  if (med.anchor) return null; // pas d'heure fixe

  const refId = med.delayFrom;
  const refTaken = state.taken[refId];
  if (!refTaken) return null; // référence pas encore prise

  return refTaken + med.gap * 60000;
}

// ---- RENDER ----
function getMedName(med) {
  if (med.id === 'fer10h') return ALT[currentDay].m10;
  return med.name;
}

function render() {
  const list = document.getElementById('meds-list');
  list.innerHTML = '';

  let sections = { matin: [], soir: [] };
  MEDS_DEF.forEach(med => sections[med.section].push(med));

  const now = Date.now();
  let doneCount = 0, totalCount = 0;

  ['matin', 'soir'].forEach(sec => {
    const secDiv = document.createElement('div');
    secDiv.className = 'section';

    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `<span class="section-icon">${sec === 'matin' ? '☀️' : '🌙'}</span><span class="section-title">${sec === 'matin' ? 'Matin' : 'Soir'}</span>`;
    secDiv.appendChild(head);

    sections[sec].forEach(med => {
      totalCount++;
      const takenAt = state.taken[med.id];
      const scheduled = getScheduledTime(med.id);
      const isDone = !!takenAt;
      if (isDone) doneCount++;

      // Déterminer le statut visuel
      let status = 'pending';
      if (isDone) status = 'done';
      else if (scheduled) {
        if (now >= scheduled) status = now - scheduled > 30*60000 ? 'late' : 'next';
        else status = 'upcoming';
      } else if (med.anchor && !isDone) {
        status = 'next'; // tot'hema = toujours "suivant" si pas pris
      }

      const card = document.createElement('div');
      card.className = `med-card status-${status}`;
      if (!isDone) card.onclick = () => openModal(med.id);

      let timeHtml = '';
      if (isDone) {
        timeHtml = `<span class="card-time done">✓ ${fmtTime(takenAt)}</span>`;
      } else if (scheduled) {
        const diff = scheduled - now;
        const isLate = diff < 0;
        const gapStr = isLate
          ? `retard de ${fmtDuration(Math.round(-diff/60000))}`
          : `dans ${fmtDuration(Math.round(diff/60000))}`;
        timeHtml = `<span class="card-time ${isLate?'late':'computed'}">≈ ${fmtTime(scheduled)}</span><span class="card-gap">${gapStr}</span>`;
      } else if (med.anchor) {
        timeHtml = `<span class="card-time">Dès le réveil</span>`;
      } else {
        const ref = MEDS_DEF.find(m => m.id === med.delayFrom);
        timeHtml = `<span class="card-time" style="opacity:.4">après ${getMedName(ref) || ref?.id} + ${fmtDuration(med.gap)}</span>`;
      }

      let extraHtml = '';
      if (isDone) {
        extraHtml = `<div class="taken-badge">✓ Pris à ${fmtTime(takenAt)}</div>`;
      } else if (scheduled && scheduled > now) {
        extraHtml = `<div class="alarm-badge">🔔 Rappel prévu à ${fmtTime(scheduled)}</div>`;
      }

      card.innerHTML = `
        <div class="card-top">
          <div class="card-left">
            <div class="card-time-row">${timeHtml}</div>
            <div class="card-name">${med.icon} ${getMedName(med)}${med.optional ? ' <span style="font-size:11px;color:var(--muted)">(si besoin)</span>' : ''}</div>
            <div class="card-note">${med.note}</div>
            ${extraHtml}
          </div>
          <div class="check-btn">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>
      `;

      secDiv.appendChild(card);
    });

    list.appendChild(secDiv);
  });

  // Progress
  const pct = totalCount ? Math.round(doneCount/totalCount*100) : 0;
  document.getElementById('prog-count').textContent = `${doneCount} / ${totalCount}`;
  document.getElementById('prog-bar').style.width = pct + '%';

  // All done
  const allDone = document.getElementById('all-done');
  if (doneCount === totalCount && totalCount > 0) {
    allDone.classList.add('show');
  } else {
    allDone.classList.remove('show');
  }

  // Programmer les alarmes
  scheduleAlarms();
}

// ---- MODAL ----
function openModal(medId) {
  const med = MEDS_DEF.find(m => m.id === medId);
  if (!med || state.taken[medId]) return;

  const now = Date.now();
  pendingConfirmId = medId;

  document.getElementById('modal-title').textContent = `${med.icon} ${getMedName(med)}`;
  document.getElementById('modal-sub').textContent = med.note.replace(/<[^>]+>/g,'');
  document.getElementById('modal-time').textContent = fmtTime(now);
  document.getElementById('modal-note').innerHTML = `Heure de prise enregistrée : <b style="color:var(--accent)">${fmtTime(now)}</b><br><span style="font-size:12px">${med.note}</span>`;

  // Update confirm button
  const btn = document.getElementById('modal-confirm');
  btn.onclick = () => confirmTake(medId, now);

  document.getElementById('modal').classList.add('show');

  // Update clock in modal
  clearInterval(window._modalClock);
  window._modalClock = setInterval(() => {
    const t = Date.now();
    document.getElementById('modal-time').textContent = fmtTime(t);
    btn.onclick = () => confirmTake(medId, t);
  }, 1000);
}

function confirmTake(medId, ts) {
  state.taken[medId] = ts;
  saveState();
  closeModalDirect();
  render();
  vibrate();
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modal').classList.remove('show');
  clearInterval(window._modalClock);
  pendingConfirmId = null;
}

// ---- ALARMS ----
function scheduleAlarms() {
  // Clear existing
  Object.values(alarmTimers).forEach(t => clearTimeout(t));
  alarmTimers = {};

  const now = Date.now();
  MEDS_DEF.forEach(med => {
    if (state.taken[med.id]) return;
    const scheduled = getScheduledTime(med.id);
    if (!scheduled) return;
    const delay = scheduled - now;
    if (delay > 0 && delay < 12 * 3600000) {
      alarmTimers[med.id] = setTimeout(() => triggerAlarm(med.id), delay);
    }
    // Aussi 5 min avant
    if (delay - 300000 > 0) {
      alarmTimers[med.id + '_pre'] = setTimeout(() => triggerPreAlarm(med.id), delay - 300000);
    }
  });
}

function triggerAlarm(medId) {
  const med = MEDS_DEF.find(m => m.id === medId);
  if (!med || state.taken[medId]) return;
  showToast(`${med.icon} ${getMedName(med)}`, `C'est l'heure ! Appuie pour confirmer la prise.`);
  vibrate([200, 100, 200]);
  notifyBrowser(getMedName(med), `C'est l'heure de prendre ${getMedName(med)}`);
}

function triggerPreAlarm(medId) {
  const med = MEDS_DEF.find(m => m.id === medId);
  if (!med || state.taken[medId]) return;
  showToast(`⏰ ${getMedName(med)}`, `Dans 5 minutes`);
}

function showToast(title, detail) {
  document.getElementById('alarm-name').textContent = title;
  document.getElementById('alarm-detail').textContent = detail;
  const toast = document.getElementById('alarm-toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 8000);
}

function dismissAlarm() {
  document.getElementById('alarm-toast').classList.remove('show');
}

function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern || [300]);
}

function notifyBrowser(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body, icon: 'icon-192.png' });
  }
}

// ---- DAY ----
function setDay(d, btn) {
  currentDay = d;
  state.day = d;
  saveState();
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ---- RESET ----
function resetDay() {
  if (!confirm('Réinitialiser toutes les prises du jour ?')) return;
  state = freshState();
  state.day = currentDay;
  saveState();
  Object.values(alarmTimers).forEach(t => clearTimeout(t));
  alarmTimers = {};
  render();
}

// ---- CLOCK ----
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock-display').textContent = `${h}:${m}`;

  const days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  document.getElementById('date-display').textContent =
    `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
}

// ---- NOTIFICATIONS PERMISSION ----
function requestNotifPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

// ---- INIT ----
function init() {
  // Restore day from state
  if (state.day) {
    currentDay = state.day;
    document.querySelectorAll('.day-btn').forEach(btn => {
      if (parseInt(btn.textContent.replace('Jour ','')) === currentDay) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
  }

  updateClock();
  setInterval(updateClock, 10000);
  setInterval(render, 60000); // re-render toutes les minutes

  requestNotifPermission();
  render();
}

init();

// Register service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
